<header
  class="fixed inset-x-0 top-0 z-20 border-b border-white/10 bg-slate-950/95 px-4 py-4 text-slate-50 backdrop-blur-xl lg:px-6">
  <div class="mx-auto grid w-full gap-4 lg:grid-cols-[auto_1fr] lg:items-center">
    <div class="flex items-center justify-between min-w-0 gap-3">
      <div class="flex items-center gap-3 min-w-0 group hover:cursor-default">
        <img ngSrc="assets/logo_smart_order.png" width="84" height="84" priority alt="Logo Smart Order"
          class="h-10 w-10 sm:h-14 sm:w-14 shrink-0 object-contain lg:h-[5.25rem] lg:w-[5.25rem] drop-shadow-md transition-transform duration-500 group-hover:scale-105 group-hover:rotate-3">
        <div class="min-w-0 flex flex-col justify-center">
          <h1
            class="m-0 text-lg sm:text-2xl font-black leading-tight tracking-tight text-white lg:text-[clamp(1.2rem,1.8vw,2rem)] drop-shadow-sm uppercase line-clamp-2"
            [title]="companyName">
            {{ companyName }}</h1>
          <p class="hidden sm:block mt-0.5 text-sm font-medium text-slate-300 tracking-wide">Controle Inteligente de
            pedidos</p>
        </div>
      </div>

      <!-- Botão Hambúrguer (Mobile) -->
      <button type="button" (click)="toggleSidebar()"
        class="lg:hidden flex items-center justify-center size-10 rounded-xl bg-white/10 hover:bg-white/20 transition-colors text-slate-100">
        <span class="material-symbols-rounded">{{ isSidebarOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>

    <!-- Indicadores com rolagem horizontal no mobile -->
    <section
      class="flex overflow-x-auto snap-x snap-mandatory gap-3 pb-2 sm:pb-0 sm:grid sm:grid-cols-2 lg:grid-cols-4 hide-scrollbar"
      aria-label="Indicadores do sistema">
      <div class="snap-start min-w-[200px] sm:min-w-0 flex-1">
        <app-stat-card title="Em preparo" [value]="metrics.inPreparation" icon="local_dining"
          color="green"></app-stat-card>
      </div>
      <div class="snap-start min-w-[200px] sm:min-w-0 flex-1">
        <app-stat-card title="Atenção" [value]="metrics.attention" icon="schedule" color="yellow"></app-stat-card>
      </div>
      <div class="snap-start min-w-[200px] sm:min-w-0 flex-1">
        <app-stat-card title="Atrasados" [value]="metrics.delayed" icon="schedule" color="red"></app-stat-card>
      </div>
      <div class="snap-start min-w-[200px] sm:min-w-0 flex-1">
        <app-stat-card title="Maior Espera" [value]="metrics.longestWaitTime" icon="schedule"
          color="blue"></app-stat-card>
      </div>
    </section>
  </div>
</header>

<div
  class="mx-auto grid w-full gap-4 px-4 pt-[13rem] sm:pt-[14.5rem] lg:grid-cols-[17.5rem_minmax(0,1fr)] lg:px-6 lg:pt-[14.5rem] xl:pt-[9rem]">

  <!-- Overlay Escuro para Mobile -->
  @if (isSidebarOpen) {
  <div class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar Container -->
  <div
    class="fixed inset-y-0 left-0 z-40 w-[17.5rem] transform transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:z-auto"
    [class.-translate-x-full]="!isSidebarOpen" [class.translate-x-0]="isSidebarOpen">
    <app-sidebar (closeSidebar)="closeSidebar()" />
  </div>

  <main class="min-w-0 min-h-[calc(100vh-10rem)] w-full">
    <router-outlet />
  </main>
</div>
