<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
        <label for="email" class="block text-sm font-medium text-indigo-200 mb-1">E-mail</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
            </div>
            <input type="email" id="email" formControlName="email" 
                class="block w-full pl-10 pr-3 py-2.5 bg-slate-800/50 border border-slate-600/50 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200"
                placeholder="seu@email.com" />
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-rose-400 text-xs mt-1">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">O e-mail é obrigatório.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">E-mail inválido.</span>
        </div>
    </div>

    <div>
        <label for="password" class="block text-sm font-medium text-indigo-200 mb-1">Senha</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <input type="password" id="password" formControlName="password" 
                class="block w-full pl-10 pr-3 py-2.5 bg-slate-800/50 border border-slate-600/50 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200"
                placeholder="••••••••" />
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-rose-400 text-xs mt-1">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">A senha é obrigatória.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo de 6 caracteres.</span>
        </div>
    </div>

    <div class="flex items-center justify-between">
        <div class="flex items-center">
            <input id="remember_me" type="checkbox" class="h-4 w-4 bg-slate-800 border-slate-600 rounded text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900">
            <label for="remember_me" class="ml-2 block text-sm text-indigo-200">
                Lembrar-me
            </label>
        </div>
        <div class="text-sm">
            <a href="#" class="font-medium text-indigo-400 hover:text-indigo-300 transition duration-150">
                Esqueceu a senha?
            </a>
        </div>
    </div>

    <button type="submit" [disabled]="isLoading" 
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Entrando...
        </span>
        <span *ngIf="!isLoading">Entrar</span>
    </button>
    
    <div class="text-center mt-6">
        <p class="text-sm text-slate-400">
            Ainda não usa nosso sistema? 
            <a routerLink="/auth/register" class="font-medium text-indigo-400 hover:text-indigo-300 transition duration-150">Cadastre sua Empresa</a>
        </p>
    </div>
</form>
