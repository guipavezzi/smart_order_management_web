<article
    class="grid h-full min-h-[4.75rem] min-w-0 grid-cols-[auto_1fr] items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-slate-900 shadow-sm"
>
    <div
        class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-brand-50 text-[1.2rem] leading-none text-brand-700"
        [style.backgroundColor]="color() === 'yellow' ? '#fef3c7' : color() === 'blue' ? '#dbeafe' : color() === 'green' ? '#dcfce7' : color() === 'orange' ? '#ffedd5' : color() === 'red' ? '#ffe4e6' : '#eff6ff'"
        [style.color]="color() === 'yellow' ? '#92400e' : color() === 'blue' ? '#075985' : color() === 'green' ? '#166534' : color() === 'orange' ? '#9a3412' : color() === 'red' ? '#9f1239' : '#1d4ed8'"
        aria-hidden="true"
    >
        <span class="material-symbols-rounded block select-none">{{ icon() }}</span>
    </div>

    <div class="grid min-w-0 gap-1">
        <p class="m-0 text-xs font-semibold tracking-[0.02em] text-slate-600">{{ title() }}</p>
        <h2 class="m-0 text-xl leading-none font-bold tabular-nums text-slate-900">{{ value() }}</h2>
    </div>
</article>
