<aside
	class="flex h-full flex-col gap-4 overflow-y-auto border-r border-slate-200 bg-white p-4 text-slate-900 shadow-sm lg:rounded-2xl lg:border"
	aria-label="Menu principal">
	<div class="grid gap-1 mt-4 lg:mt-0">
		<p class="m-0 text-xs font-bold uppercase tracking-[0.12em] text-slate-500">Navegação</p>
		<h2 class="m-0 text-base font-bold">Acessos rápidos</h2>
	</div>

	<nav class="grid gap-2 mt-2" aria-label="Principais telas">
		@for (item of navigationItems; track item.path) {
		<a [routerLink]="item.path" routerLinkActive="!bg-brand-50 !text-brand-700 !font-semibold" [routerLinkActiveOptions]="{ exact: true }"
			(click)="onLinkClick()"
			class="grid grid-cols-[auto_1fr] items-center gap-3 rounded-lg border border-transparent px-3 py-2.5 text-sm font-medium text-slate-600 no-underline transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
			ariaCurrentWhenActive="page">
			<div class="flex size-9 items-center justify-center rounded-lg bg-slate-100 text-slate-500"
				aria-hidden="true">
				<span class="material-symbols-rounded text-[1.05rem] leading-none">
					{{ item.icon }}
				</span>
			</div>
			<span>{{ item.label }}</span>
		</a>
		}
	</nav>

	<section
		class="mt-auto grid gap-1 rounded-xl border border-slate-200 bg-slate-50 p-4 text-slate-900"
		aria-label="Tempo médio de hoje">
		<p class="m-0 text-xs uppercase tracking-[0.08em] text-slate-500">{{ averageTimeLabel }}</p>
		<strong class="text-2xl leading-none font-extrabold tabular-nums">{{ averageTimeValue }}</strong>
		<span class="text-xs text-slate-600">Atualizado para a operação de hoje</span>
	</section>

	<button type="button" (click)="closeShift()"
		class="flex items-center justify-center gap-2 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-bold text-rose-800 transition hover:bg-rose-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-700">
		<span class="material-symbols-rounded text-lg">event_busy</span>
		Encerrar Expediente
	</button>

	<button type="button" (click)="confirmLogout()"
		class="mt-2 flex items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">
		<span class="material-symbols-rounded text-lg">logout</span>
		Sair
	</button>
</aside>
