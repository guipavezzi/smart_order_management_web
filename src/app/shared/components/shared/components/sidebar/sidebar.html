<aside
	class="flex h-full flex-col gap-4 lg:sticky lg:top-[14.5rem] xl:top-[9rem] lg:h-[calc(100vh-15.5rem)] xl:h-[calc(100vh-10rem)] bg-slate-950/95 p-4 text-slate-50 shadow-[0_18px_40px_rgba(6,12,24,0.18)] backdrop-blur-xl border-r border-white/10 lg:rounded-2xl lg:border"
	aria-label="Menu principal">
	<div class="grid gap-1 mt-4 lg:mt-0">
		<p class="m-0 text-[0.75rem] font-bold uppercase tracking-[0.12em] text-slate-50/60">Navegação</p>
		<h2 class="m-0 text-[1.1rem] font-bold">Acessos rápidos</h2>
	</div>

	<nav class="grid gap-2 mt-2" aria-label="Principais telas">
		@for (item of navigationItems; track item.path) {
		<a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
			(click)="onLinkClick()"
			class="grid grid-cols-[auto_1fr] items-center gap-3 rounded-[0.95rem] border border-transparent bg-white/5 px-4 py-3 text-slate-50/80 no-underline transition hover:-translate-y-0.5 hover:border-white/10 hover:bg-white/10">
			<div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 text-sky-300"
				aria-hidden="true">
				<span class="material-symbols-rounded text-[1.05rem] leading-none">
					{{ item.icon }}
				</span>
			</div>
			<span class="text-[0.95rem] font-semibold">{{ item.label }}</span>
		</a>
		}
	</nav>

	<section
		class="mt-auto grid gap-1 rounded-2xl border border-white/10 bg-linear-to-b from-slate-900 to-slate-950 p-4 text-slate-50"
		aria-label="Tempo médio de hoje">
		<p class="m-0 text-[0.75rem] uppercase tracking-[0.12em] text-slate-50/60">{{ averageTimeLabel }}</p>
		<strong class="text-[1.7rem] leading-none font-extrabold">{{ averageTimeValue }}</strong>
		<span class="text-sm text-slate-50/70">Atualizado para a operação de hoje</span>
	</section>

	<button type="button" (click)="closeShift()"
		class="flex items-center justify-center gap-2 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-[0.95rem] font-bold text-rose-400 transition hover:bg-rose-500 hover:text-white hover:cursor-pointer shadow-sm">
		<span class="material-symbols-rounded text-lg">event_busy</span>
		Encerrar Expediente
	</button>

	<button type="button" (click)="confirmLogout()"
		class="flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-[0.95rem] font-bold text-slate-300 transition hover:bg-slate-700 hover:text-white hover:cursor-pointer shadow-sm mt-2">
		<span class="material-symbols-rounded text-lg">logout</span>
		Sair
	</button>
</aside>
